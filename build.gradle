plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"thefourthfrequency" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			name = "The Fourth Frequency Client"
			runDir = "run/client"
		}
		server {
			server()
			name = "The Fourth Frequency Dedicated Server"
			runDir = "run/server"
			programArg "--nogui"
		}
	}
}

tasks.named("runServer") {
	standardInput = System.in
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	configureTests {
		createSourceSet = true
		modId = "thefourthfrequency-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

sourceSets {
	main {
		resources {
			srcDir "src/main/generated"
		}
	}
	gametest {
		// Server and client GameTests intentionally share this source set.  The latter reference
		// split-environment client classes even when only the dedicated GameTest runner is launched.
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
	test {
		compileClasspath += sourceSets.gametest.output
		runtimeClasspath += sourceSets.gametest.output
	}
}

repositories {
	mavenCentral()
}

configurations {
	unitTestRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testCompileOnly platform("org.junit:junit-bom:${project.junit_version}")
	testCompileOnly "org.junit.jupiter:junit-jupiter-api"

	unitTestRuntime "org.junit.platform:junit-platform-console-standalone:1.10.0"
	unitTestRuntime "com.google.code.gson:gson:2.13.2"
}

processResources {
	// Captured by value: filesMatching runs during execution, where reading the task's own
	// inputs back out is not allowed under the configuration cache.
	def modVersion = project.version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = "UTF-8"
}

tasks.withType(Jar).configureEach {
	from(rootProject.file("LICENSE")) {
		into "META-INF"
	}
}

def unitTest = tasks.register("unitTest", JavaExec) {
	group = "verification"
	description = "Runs unit tests with the JUnit Console Launcher and writes XML reports."
	dependsOn tasks.named("testClasses")
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	// The classpath must be able to load every class a test method's *signature* references
	// (not just what its body executes), or JUnit's discovery silently drops the whole class
	// with a DEBUG-level NoClassDefFoundError and no test/error is ever recorded for it. Several
	// test classes reference Minecraft types (CompoundTag, StreamCodec, ItemLike, ...) in helper
	// method signatures, so the plain JUnit-only classpath previously used here made those
	// classes vanish without a trace. sourceSets.test.runtimeClasspath is the classpath Loom
	// already wires up with the remapped Minecraft/Fabric jars for the (disabled) "test" task,
	// so reusing it here gives unitTest the same visibility.
	classpath = sourceSets.test.runtimeClasspath + configurations.unitTestRuntime
	mainClass = "org.junit.platform.console.ConsoleLauncher"

	// Resolved at configuration time and captured by value. The configuration cache forbids
	// reaching back into the project (sourceSets, fileTree, ...) once execution starts, and the
	// class list still has to be built during execution because compileTestJava has not run yet
	// when this block is configured. Holding the directories and the report path in locals
	// satisfies both constraints.
	def unitTestClassesDirs = sourceSets.test.output.classesDirs
	def unitTestReportsDir = layout.buildDirectory.dir("test-results/unit")

	doFirst {
		// --scan-class-path silently drops any class JUnit fails to load during discovery
		// instead of reporting it as an error, and it also picks up unrelated *Tests-suffixed
		// classes from the gametest source set that happen to be on this classpath. Enumerating
		// every compiled test class explicitly via --select-class makes both failure modes into
		// hard, visible errors instead of silent gaps in the report.
		List<String> selectors = []
		unitTestClassesDirs.filter { it.exists() }.each { dir ->
			java.nio.file.Files.walk(dir.toPath()).withCloseable { stream ->
				stream.filter { it.toString().endsWith(".class") }.forEach { classFile ->
					String relative = dir.toPath().relativize(classFile).toString()
					if (relative.contains('$')) return // nested/anonymous/local classes
					selectors << (relative.replace(File.separator, ".") - ".class")
				}
			}
		}
		if (selectors.isEmpty()) {
			throw new GradleException("No compiled test classes found under ${unitTestClassesDirs.files}")
		}
		args = ["execute"] +
				selectors.collectMany { ["--select-class", it] } +
				["--fail-if-no-tests",
				 "--disable-ansi-colors",
				 "--details=summary",
				 "--reports-dir=${unitTestReportsDir.get().asFile.absolutePath}"]
	}
}

tasks.named("compileTestJava") {
	dependsOn tasks.named("compileGametestJava")
}

tasks.named("test", Test) {
	enabled = false
	dependsOn unitTest
}

tasks.named("check") {
	dependsOn unitTest
}

// A successful full build is also the local playtest hand-off. Keep this on `build` rather than
// `remapJar`: compile/test failures must never replace the last known-good mod in the instance.
//
// Off by default, because a hard-coded destination is one particular machine's launcher and this
// file is checked in. Point it at your own instance somewhere Git never sees - the user-wide
// ~/.gradle/gradle.properties (%USERPROFILE%\.gradle\gradle.properties on Windows):
//
//     tffDeployDir=E:/SomeLauncher/.minecraft/versions/1.21.11-Fabric/mods
//
// or pass -PtffDeployDir=<path> for a single invocation. An empty value disables the step, and a
// missing drive or parent directory skips the copy with a notice instead of failing the build, so
// `build` works unchanged on a fresh clone that has configured nothing.
def deployDirProperty = providers.gradleProperty("tffDeployDir").orElse("")
def remappedModJar = tasks.named("remapJar").flatMap { it.archiveFile }
tasks.named("build") {
	doLast {
		String configured = deployDirProperty.get().trim()
		if (configured.isEmpty()) {
			logger.lifecycle("Local deployment disabled: tffDeployDir is not set. "
					+ "Set it in ~/.gradle/gradle.properties or pass -PtffDeployDir=<path> to deploy.")
			return
		}
		File source = remappedModJar.get().asFile
		if (!source.isFile()) throw new GradleException("Remapped mod JAR was not produced: ${source}")
		File modsDirectory = file(configured)
		File root = modsDirectory.toPath().getRoot()?.toFile()
		if (root != null && !root.exists()) {
			logger.lifecycle("Skipping local deployment: ${root} is not available. " +
					"Set -PtffDeployDir=<path> to deploy elsewhere.")
			return
		}
		java.nio.file.Files.createDirectories(modsDirectory.toPath())
		File target = new File(modsDirectory, source.name)
		java.nio.file.Files.copy(source.toPath(), target.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		logger.lifecycle("Deployed remapped mod JAR to ${target}")
	}
}

def clientTestSuite = providers.gradleProperty("tffClientTestSuite").orElse("all")
def clientAnomaly = providers.gradleProperty("tffAnomaly").orElse("")

tasks.named("runClientGameTest") {
	doFirst {
		def suite = clientTestSuite.get().trim().toLowerCase(Locale.ROOT)
		def allowed = ["all", "default", "mainline", "tools-ui", "notice-entry", "alpha-relaunch", "anomalies", "anomaly-meta-smoke", "rework-forms", "watcher-model", "world-interface", "terminal-3d", "screen-filters"]
		if (!allowed.contains(suite)) throw new GradleException("Unknown -PtffClientTestSuite=${suite}")
		def anomaly = clientAnomaly.get().trim()
		if (!anomaly.isEmpty() && suite != "anomalies")
			throw new GradleException("-PtffAnomaly requires -PtffClientTestSuite=anomalies")
		if (suite == "alpha-relaunch") {
			// The runner deletes its run directory before every invocation. Seed only the two
			// markers that a real second launch would inherit from the completed first launch.
			def configDir = layout.buildDirectory.dir("run/clientGameTest/config").get().asFile
			configDir.mkdirs()
			new File(configDir, "thefourthfrequency.json").setText(
					'{\n  "clientState": {\n    "alphaDowngradeComplete": true,\n    "viewDistanceUnlocked": false\n  }\n}\n',
					"UTF-8")
			new File(configDir, "thefourthfrequency-safety-notice.version").setText("3\n", "UTF-8")
		}
	}
	// Minecraft includes hardware details in its startup crash report. Bound OSHI's Windows WMI
	// queries so a broken local provider cannot leave the client test runner hanging indefinitely.
	jvmArgs "-Doshi.util.wmi.timeout=5000",
			"-Dthefourthfrequency.clientTestSuite=${clientTestSuite.get()}",
			"-Dthefourthfrequency.anomaly=${clientAnomaly.get()}",
			"-Dthefourthfrequency.projectDir=${project.projectDir.absolutePath}"
	// "all" and "default" both resolve to Suite.ALL, which runs the rework-forms, watcher-model and
	// world-interface tests as well - and those are exactly the ones that touch packets at a level
	// the synchronizer refuses. Listing only their own suite names meant the full run could never
	// finish: it died on the synchronizer the moment it reached them, no matter what it had proved
	// up to that point.
	// terminal-3d joins them because it stages the shell by writing the player's inventory from the
	// client - six forms and an off-hand torch - which is exactly the kind of write the
	// synchronizer refuses.
	if (["all", "default", "rework-forms", "watcher-model", "world-interface", "terminal-3d"]
			.contains(clientTestSuite.get().trim().toLowerCase(Locale.ROOT))) {
		jvmArgs "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

tasks.register("printTestRuntimeClasspath") {
	group = "verification"
	description = "Prints unit-test outputs and runtime classpath for reproducible diagnostics."
	doLast {
		Test testTask = tasks.named("test", Test).get()
		println "testClassesDirs:"
		testTask.testClassesDirs.files.sort().each { println "  ${it}" }
		println "testClasspath:"
		testTask.classpath.files.sort().each { println "  ${it}" }
	}
}
